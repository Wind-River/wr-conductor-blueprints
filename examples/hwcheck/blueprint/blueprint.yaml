tosca_definitions_version: cloudify_dsl_1_5

imports:
  - cloudify/types/types.yaml
  - plugin:cloudify-fabric-plugin

inputs:
  ip_address:
    type: string
    description: Target host IP address
    default: hwcheck_ip_address
  username:
    type: string
    description: SSH username
    default: hwcheck_username
  password:
    type: string
    description: SSH password
    default: hwcheck_password

node_templates:
  host:
    type: cloudify.nodes.Compute
    properties:
      ip: { get_secret: { get_input: ip_address } }
      agent_config:
        install_method: none

  hwcheck:
    type: cloudify.nodes.Root
    interfaces:
      cloudify.interfaces.lifecycle:
        start:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: run_hwcheck.sh
            process:
              env:
                CFY_EXEC_TEMP: /tmp
            fabric_env:
              host_string: { get_secret: { get_input: ip_address } }
              user: { get_secret: { get_input: username } }
              password: { get_secret: { get_input: password } }
    relationships:
      - type: cloudify.relationships.contained_in
        target: host

outputs:
  hwcheck_result:
    value: { get_attribute: [hwcheck, hwcheck_output] }
