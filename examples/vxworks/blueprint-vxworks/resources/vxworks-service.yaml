apiVersion: v1
kind: Service
metadata:
  name: vxworks-k8s
  namespace: default
spec:
  type: NodePort
  selector:
    app: vxworks-k8s
  ports:
    - name: telnet
      port: 10023
      targetPort: 10023
      nodePort: 30023
    - name: web-terminal
      port: 7681
      targetPort: 7681
      nodePort: 30681
